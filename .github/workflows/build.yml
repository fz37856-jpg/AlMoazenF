name: Build AlMoazenF APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Upload Flutter source
        uses: actions/upload-artifact@v4
        with:
          name: AlMoazenF-Source
          path: |
            lib/
            android/
            pubspec.yaml
            pubspec.lock
            README.md
            analysis_options.yaml
            test/
      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlMoazenF-APK
          path: build/app/outputs/flutter-apk/app-release.apk
